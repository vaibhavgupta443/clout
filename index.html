<script>
/* first paint: pick the saved theme before anything is drawn (the app sets the same value again once it starts) */
try { var t = (JSON.parse(localStorage.getItem('clout_settings_v1')) || {}).theme; document.documentElement.setAttribute('data-theme', t === 'dark' || t === 'amoled' ? t : 'light'); } catch (e) {}
</script>
<style>
/* splash: painted with the very first frame, before ~800 KB of script is downloaded and parsed; the first real screen replaces it */
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;background:var(--c-bg,#fafbfc);color:var(--c-text,#14181f);font:600 15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#splash .sp-logo{font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--c-text,#14181f)}
#splash .sp-bars{width:min(260px,70vw);display:grid;gap:10px}
#splash .sp-bars i{display:block;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--c-surface-2,#f2f4f7) 25%,var(--c-surface-3,#e8ebf0) 50%,var(--c-surface-2,#f2f4f7) 75%);background-size:300% 100%;animation:spsh 1.3s linear infinite}
#splash .sp-bars i:nth-child(2){width:78%}#splash .sp-bars i:nth-child(3){width:52%}
@keyframes spsh{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){#splash .sp-bars i{animation:none}}
</style>
<link rel="stylesheet" href="css/style.css">
